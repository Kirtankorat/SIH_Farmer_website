  <div class="cart-page">
    <div class="container">

      <div class="cart-header">
        <h1>Your Cart</h1>
        <span class="cart-item-count" id="cartItemCount"></span>
      </div>

      <div id="cartContent">
        <!-- Filled by JS -->
      </div>

    </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/orders.js"></script>
  <script src="app.js"></script>
  <script>
    async function renderCart() {
      let cart = [];
      if (window.HarvestLinkCart) {
        cart = await window.HarvestLinkCart.fetchCart();
      } else {
        cart = getCart();
      }

      const content = document.getElementById('cartContent');
      const countEl = document.getElementById('cartItemCount');

      countEl.textContent = cart.length > 0 ? `${cart.reduce((s,i) => s + (i.qty || 1), 0)} items` : '';

      if (cart.length === 0) {
        content.innerHTML = `
          <div class="cart-empty">
            <div class="ce-icon">🛒</div>
            <div class="ce-title">Your cart is empty.</div>
            <div class="ce-desc">Discover fresh produce directly from farmers.<br>Add your first item to get started.</div>
            <a href="marketplace.html" class="btn-primary-lg">Shop Produce →</a>
          </div>
        `;
        if (window.HarvestLinkI18n) window.HarvestLinkI18n.translateDOM(content);
        return;
      }

      const subtotal = cart.reduce((sum, i) => sum + (parseFloat(i.priceNum || 0) * (i.qty || 1)), 0);
      const DELIVERY = subtotal > 800 ? 0 : 40;
      const discount = subtotal > 500 ? 50 : 0;
      const total = Math.max(0, subtotal + DELIVERY - discount);

      const itemsHtml = cart.map(item => {
        const lineTotal = ((item.priceNum || 0) * item.qty).toFixed(0);
        return `
          <div class="cart-item" id="cartRow_${item.id}">
            <div class="cart-item-img">${item.emoji || '🌾'}</div>
            <div>
              <div class="ci-name">${item.name}</div>
              <div class="ci-farmer">${item.farmer || 'Farm Partner'}</div>
              <div class="ci-location">📍 ${item.location || 'Gujarat'}</div>
              <div class="ci-price">${item.price || '₹' + item.priceNum} <span class="ci-unit">/ ${item.unit || 'kg'}</span></div>
              <div class="ci-actions">
                <button class="ci-remove" onclick="cartRemove('${item.id}')">Remove</button>
                <button class="ci-save" onclick="showToast('Saved for later', 'info')">Save for Later</button>
              </div>
            </div>
            <div class="cart-item-right">
              <div class="qty-control">
                <button class="qty-btn" onclick="cartQty('${item.id}', -1)">−</button>
                <span class="qty-display" id="qty_${item.id}">${item.qty}</span>
                <button class="qty-btn" onclick="cartQty('${item.id}', 1)">+</button>
              </div>
              <div class="ci-subtotal" id="sub_${item.id}">₹${lineTotal}</div>
            </div>
          </div>
        `;
      }).join('');

      content.innerHTML = `
        <div class="cart-layout">
          <div>
            <div class="cart-items" id="cartItemsList">${itemsHtml}</div>
            <div style="margin-top:20px;">
              <a href="marketplace.html" style="font-size:14px;font-weight:700;color:var(--green);">← Continue Shopping</a>
            </div>
          </div>

          <div class="cart-summary">
            <div class="cs-title">Order Summary</div>
            <div class="cs-row"><span class="cs-label">Subtotal</span><span class="cs-value" id="sumSubtotal">₹${subtotal}</span></div>
            <div class="cs-row"><span class="cs-label">Delivery</span><span class="cs-value">${DELIVERY === 0 ? 'FREE' : '₹' + DELIVERY}</span></div>
            ${discount > 0 ? `<div class="cs-row"><span class="cs-label" style="color:var(--green)">Discount</span><span class="cs-value" style="color:var(--green)">−₹${discount}</span></div>` : ''}
            <div class="cs-total">
              <span class="cs-total-label">Total</span>
              <span class="cs-total-value" id="sumTotal">₹${total}</span>
            </div>
            <button class="auth-btn-primary" id="btnCheckout" style="width:100%;font-size:15px" onclick="doCheckout()">Proceed to Checkout →</button>
            <div style="text-align:center;margin-top:12px;font-size:12px;color:var(--text-muted)">Free delivery on orders above ₹800</div>

            <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border)">
              <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Your Farmers</div>
              ${[...new Set(cart.map(i => i.farmer || 'Farm Partner'))].map(f => `<div style="font-size:13px;color:var(--text-secondary);padding:4px 0">✓ ${f}</div>`).join('')}
            </div>
          </div>
        </div>
      `;
      if (window.HarvestLinkI18n) window.HarvestLinkI18n.translateDOM(content);
    }

    async function cartRemove(id) {
      if (window.HarvestLinkCart) {
        await window.HarvestLinkCart.removeFromCart(id);
      } else {
        removeFromCart(id);
      }
      await renderCart();
    }

    async function cartQty(id, delta) {
      if (window.HarvestLinkCart) {
        await window.HarvestLinkCart.updateCartQty(id, delta);
      } else {
        updateCartQty(id, delta);
      }
      await renderCart();
    }

    async function doCheckout() {
      const sb = window.getSupabase ? window.getSupabase() : null;
      let session = null;
      if (sb) {
        try {
          const res = await sb.auth.getSession();
          session = res?.data?.session;
        } catch (_) {}
      }

      if (!session || !session.user) {
        if (typeof showToast === 'function') {
          showToast('Please login to place your order.', 'info');
        }
        setTimeout(() => {
          window.location.href = 'login.html?redirect=cart.html';
        }, 1000);
        return;
      }

      const cart = window.HarvestLinkCart ? window.HarvestLinkCart.getCart() : [];
      if (!cart || !cart.length) {
        if (typeof showToast === 'function') showToast('Your cart is empty', 'error');
        return;
      }

      const btn = document.getElementById('btnCheckout');
      if (btn) {
        btn.textContent = 'Placing Order...';
        btn.disabled = true;
      }

      try {
        const order = await window.HarvestLinkOrders.createOrder({
          name: session.user.user_metadata?.full_name || 'Priya Sharma',
          phone: session.user.user_metadata?.phone || '+91 98250 88990',
          address: 'Flat 402, Green Meadows, Station Road',
          city: 'Anand',
          state: 'Gujarat'
        });

        if (typeof showToast === 'function') {
          showToast('Order placed successfully!', 'success');
        }

        setTimeout(() => {
          window.location.href = `order-tracking.html?order=${order.order_number}&new=1`;
        }, 600);
      } catch (err) {
        if (btn) {
          btn.textContent = 'Proceed to Checkout →';
          btn.disabled = false;
        }
        if (typeof showToast === 'function') {
          showToast(err.message || 'Checkout failed. Please try again.', 'error');
        }
      }
    }

    window.addEventListener('hl-language-changed', renderCart);
    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
