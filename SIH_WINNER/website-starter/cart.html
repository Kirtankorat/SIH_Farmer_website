  <div class="cart-page">
    <div class="container">

      <div class="cart-header">
        <h1 data-i18n="cart.title">Your Cart</h1>
        <span class="cart-item-count" id="cartItemCount"></span>
      </div>

      <div id="cartContent">
        <!-- Filled by JS -->
      </div>

    </div>
  </div>

  <script src="translations/en.js"></script>
  <script src="translations/hi.js"></script>
  <script src="translations/gu.js"></script>
  <script src="translations/i18n.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const content = document.getElementById('cartContent');
      const countEl = document.getElementById('cartItemCount');

      countEl.textContent = cart.length > 0 ? `${cart.reduce((s,i) => s+i.qty, 0)} items` : '';

      const tr = (k, def) => (typeof window.t === 'function') ? window.t(k, def) : def;

      if (cart.length === 0) {
        content.innerHTML = `
          <div class="cart-empty">
            <div class="ce-icon">🛒</div>
            <div class="ce-title" data-i18n="cart.empty_title">${tr('cart.empty_title', 'Your cart is empty.')}</div>
            <div class="ce-desc" data-i18n="cart.empty_sub">${tr('cart.empty_sub', 'Discover fresh produce directly from farmers. Add items to get started.')}</div>
            <a href="marketplace.html" class="btn-primary-lg" data-i18n="cart.shop_btn">${tr('cart.shop_btn', 'Shop Produce →')}</a>
          </div>
        `;
        return;
      }

      const DELIVERY = 40;
      const subtotal = getCartTotal();
      const discount = subtotal > 500 ? 50 : 0;
      const total = subtotal + DELIVERY - discount;

      const itemsHtml = cart.map(item => {
        const lineTotal = (item.priceNum * item.qty).toFixed(0);
        return `
          <div class="cart-item" id="cartRow_${item.id}">
            <div class="cart-item-img">${item.emoji || '🌾'}</div>
            <div>
              <div class="ci-name">${item.name}</div>
              <div class="ci-farmer">${item.farmer || item.farmer_name || 'Farm Partner'}</div>
              <div class="ci-location">📍 ${item.location || 'Gujarat'}</div>
              <div class="ci-price">${item.price} <span class="ci-unit">/ ${item.unit}</span></div>
              <div class="ci-actions">
                <button class="ci-remove" onclick="cartRemove(${item.id})" data-i18n="cart.item_remove">${tr('cart.item_remove', 'Remove')}</button>
              </div>
            </div>
            <div class="cart-item-right">
              <div class="qty-control">
                <button class="qty-btn" onclick="cartQty(${item.id}, -1)">−</button>
                <span class="qty-display" id="qty_${item.id}">${item.qty}</span>
                <button class="qty-btn" onclick="cartQty(${item.id}, 1)">+</button>
              </div>
              <div class="ci-subtotal" id="sub_${item.id}">₹${lineTotal}</div>
            </div>
          </div>
        `;
      }).join('');

      content.innerHTML = `
        <div class="cart-layout">
          <div>
            <div class="cart-items" id="cartItemsList">${itemsHtml}</div>
            <div style="margin-top:20px;">
              <a href="marketplace.html" style="font-size:14px;font-weight:700;color:var(--green);" data-i18n="cart.continue_shopping">${tr('cart.continue_shopping', '← Continue Shopping')}</a>
            </div>
          </div>

          <div class="cart-summary">
            <div class="cs-title" data-i18n="cart.order_summary">${tr('cart.order_summary', 'Order Summary')}</div>
            <div class="cs-row"><span class="cs-label" data-i18n="cart.subtotal">${tr('cart.subtotal', 'Subtotal')}</span><span class="cs-value" id="sumSubtotal">₹${subtotal}</span></div>
            <div class="cs-row"><span class="cs-label" data-i18n="cart.delivery_fee">${tr('cart.delivery_fee', 'Delivery')}</span><span class="cs-value">₹${DELIVERY}</span></div>
            ${discount > 0 ? `<div class="cs-row"><span class="cs-label" style="color:var(--green)" data-i18n="cart.discount">${tr('cart.discount', 'Discount')}</span><span class="cs-value" style="color:var(--green)">−₹${discount}</span></div>` : ''}
            <div class="cs-total">
              <span class="cs-total-label" data-i18n="cart.total">${tr('cart.total', 'Total')}</span>
              <span class="cs-total-value" id="sumTotal">₹${total}</span>
            </div>
            <button class="auth-btn-primary" id="btnCheckout" style="width:100%;font-size:15px" onclick="doCheckout()" data-i18n="cart.checkout_btn">${tr('cart.checkout_btn', 'Proceed to Checkout →')}</button>
            <div style="text-align:center;margin-top:12px;font-size:12px;color:var(--text-muted)" data-i18n="cart.delivery_notice">${tr('cart.delivery_notice', 'Free delivery on orders above ₹800')}</div>

            <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border)">
              <div style="font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px" data-i18n="cart.farmer_impact">${tr('cart.farmer_impact', 'Direct Farmer Benefit')}</div>
              <p style="font-size:12px;color:var(--text-muted);line-height:1.5;margin-bottom:12px" data-i18n="cart.farmer_impact_desc">${tr('cart.farmer_impact_desc', '88% of your order value goes directly to the farmers who harvested your food.')}</p>
              ${[...new Set(cart.map(i => i.farmer || i.farmer_name || 'Farm Partner'))].map(f => `<div style="font-size:13px;color:var(--text-secondary);padding:4px 0">✓ ${f}</div>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function cartRemove(id) {
      removeFromCart(id);
      renderCart();
    }

    function cartQty(id, delta) {
      updateCartQty(id, delta);
      const cart = getCart();
      const item = cart.find(i => i.id === id);
      if (!item) { renderCart(); return; }
      document.getElementById('qty_' + id).textContent = item.qty;
      document.getElementById('sub_' + id).textContent = '₹' + (item.priceNum * item.qty);
      const DELIVERY = 40;
      const subtotal = getCartTotal();
      const discount = subtotal > 500 ? 50 : 0;
      const total = subtotal + DELIVERY - discount;
      document.getElementById('sumSubtotal').textContent = '₹' + subtotal;
      document.getElementById('sumTotal').textContent = '₹' + total;
    }

    async function doCheckout() {
      const user = getUser();
      const cart = getCart();
      if (!cart.length) {
        showToast((typeof window.t === 'function') ? window.t('cart.empty_title', 'Your cart is empty') : 'Your cart is empty');
        return;
      }

      const btn = document.getElementById('btnCheckout');
      if (btn) {
        btn.textContent = 'Placing Order...';
        btn.disabled = true;
      }

      try {
        const orderData = {
          buyer_name: user?.name || 'Priya Sharma',
          buyer_email: user?.email || 'priya@demo.in',
          buyer_phone: user?.phone || '+91 98765 43210',
          delivery_address: 'Flat 402, Green Meadows, Anand, Gujarat',
          delivery_city: 'Anand',
          delivery_state: 'Gujarat',
          delivery_fee: 40.0,
          discount: getCartTotal() > 500 ? 50.0 : 0.0,
          items: cart.map(i => ({
            product_id: i.id,
            product_name: i.name,
            emoji: i.emoji || '🌾',
            price: i.priceNum || 30.0,
            quantity: i.qty || 1,
            unit: i.unit || 'kg',
            seller_name: i.farmer || i.farmer_name || 'Shree Farms'
          }))
        };

        const res = await api.createOrder(orderData);
        clearCart();
        const orderNum = res.order_number || 'HL1024';
        window.location.href = `order-tracking.html?order=${orderNum}&new=1`;
      } catch (err) {
        console.warn('Backend checkout note:', err.message);
        clearCart();
        window.location.href = 'order-tracking.html?new=1';
      }
    }

    document.addEventListener('languageChanged', renderCart);
    renderCart();
  </script>
